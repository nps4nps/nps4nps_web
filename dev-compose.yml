# Inspired by https://github.com/astral-sh/uv-docker-example/blob/main/compose.yml
services:
  worker:
    build: .
    command: celery -A app.core.celery_app.celery worker --loglevel=info
    env_file:
      - .env
    depends_on:
      - app
      - redis
    networks:
      - app_network
    develop:
      watch:
        - action: sync+restart
          path: .
          target: /app
          ignore:
            - .venv/

  app:
    # Build the image from the Dockerfile in the current directory
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    networks:
      - app_network
    depends_on:
      - redis
    # Include development dependencies when working locally
    environment:
      - UV_NO_DEV=0
    # Override production command with dev
    command: uvicorn app.main:app --reload --reload-include *.html --host 0.0.0.0 --port 8000
    develop:
      # Create a `watch` configuration to update the app
      # https://docs.docker.com/compose/file-watch/#compose-watch-versus-bind-mounts
      watch:
        # Sync the working directory with the `/app` directory in the container
        - action: sync
          path: .
          target: /app
          # Exclude the project virtual environment — it could be for a
          # different platform in the container
          ignore:
            - .venv/

        # Rebuild the image if dependencies change by checking uv.lock
        - action: rebuild
          path: ./uv.lock

  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  redis_data:

