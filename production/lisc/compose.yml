services:
  beat:
    build: .
    command: celery -A app.core.celery_app.celery beat --loglevel=info
    volumes:
      - map_data:/data/maps
    networks:
      - app_network
    depends_on:
      - app
      - redis

  worker:
    build: .
    command: celery -A app.core.celery_app.celery worker --loglevel=info
    env_file:
      - .env
    depends_on:
      - app
      - redis
    networks:
      - app_network
    volumes:
      - map_data:/data/maps

  app:
    image: ghcr.io/nps4nps/nps4nps_web:latest
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - app_network
    volumes:
      - map_data:/data/maps
    depends_on:
      - redis

  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - map_data:/data/maps
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  redis_data:
  map_data: