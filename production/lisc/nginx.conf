events {}

http {

    map $http_x_forwarded_proto $proxy_proto {
        default $http_x_forwarded_proto;
        "" https;
    }

    map $http_x_forwarded_host $proxy_host {
        default $http_x_forwarded_host;
        "" $host;
    }

    upstream validation {
        server app:8000;
    }

    server {
        listen 80;
        server_name validation.nanopub.univie.ac.at;
        return 301 https://$http_host$request_uri;
    }
    
    server {
        listen 443 ssl;
        server_name validation.nanopub.univie.ac.at;
        ssl_certificate     /etc/nginx/validation.nanopub.univie.ac.at.fullchain.pem;
        ssl_certificate_key /etc/nginx/validation.nanopub.univie.ac.at.privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
    
        location / {
            proxy_pass http://validation;
    
            proxy_set_header Host $proxy_host;
            proxy_set_header X-Forwarded-Host $proxy_host;
            proxy_set_header X-Forwarded-Proto $proxy_proto;
    
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    
            proxy_redirect off;
        }
    }

}
